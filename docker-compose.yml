services:
  postgres:
    image: postgres:16-alpine
    container_name: coachmate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachmate
      POSTGRES_PASSWORD: coachmate
      POSTGRES_DB: coachmate
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coachmate']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: coachmate-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coachmate
      MINIO_ROOT_PASSWORD: coachmate123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
